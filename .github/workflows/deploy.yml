
name: Pubblica sito Vite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Scarica progetto
        uses: actions/checkout@v4

      - name: Installa Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa dipendenze
        run: npm ci

      - name: Compila sito
        run: npm run build

      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Carica sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
